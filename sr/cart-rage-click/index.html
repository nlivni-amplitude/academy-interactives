<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart rage-click replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "IBM Plex Sans", "Noto Sans Myanmar", sans-serif; color: #000; background: #fff; padding: 8px; }
  .wrap { max-width: 500px; margin: 0 auto; }
  video { display: block; width: 100%; height: auto; border: 1px solid #e6e6e6; border-radius: 8px; background: #fff; }
  .cap { font-size: 13px; color: #555; margin-top: 8px; text-align: center; line-height: 1.45; }
</style>
</head>
<body>
<div class="wrap">
  <video src="assets/cart-rage-click.mp4" autoplay loop muted playsinline controls preload="metadata"
         aria-label="A real AmpliStore session at checkout: a dead click, then a rage click, then the shopper abandons."></video>
  <p class="cap">A real AmpliStore session at checkout: a dead click, then a rage click, then the shopper abandons. Use the controls to pause on the moment.</p>
</div>
</body>
</html>
