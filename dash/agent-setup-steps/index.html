<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Dashboard Agent: five steps</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "IBM Plex Sans", "Noto Sans Myanmar", sans-serif;
      background: #fff;
      color: #000;
      padding: 24px 20px 22px;
    }

    .wrap { max-width: 820px; margin: 0 auto; }

    /* ---- stepper rail ---- */
    .rail {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      margin: 0 6px 22px;
    }
    .rail::before {
      content: "";
      position: absolute;
      top: 17px;
      left: 24px;
      right: 24px;
      height: 2px;
      background: #e0e0e0;
      z-index: 0;
    }
    .pill {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      background: #fff;
      padding: 0 4px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      width: 20%;
    }
    .dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      background: #f0f0f0;
      color: #888;
      border: 2px solid #e0e0e0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .pill:hover .dot { border-color: #1E61F0; color: #1E61F0; }
    .pill.active .dot { background: #1E61F0; color: #fff; border-color: #1E61F0; }
    .pill.done .dot { background: #e8eef8; color: #1E61F0; border-color: #cadaf6; }
    .plabel {
      font-size: 12px;
      line-height: 1.25;
      color: #888;
      text-align: center;
      max-width: 118px;
      transition: color 0.2s;
    }
    .pill.active .plabel { color: #1E61F0; font-weight: 600; }
    .pill.done .plabel { color: #555; }

    /* ---- detail panel ---- */
    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: center;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 22px 24px;
      min-height: 218px;
    }
    .copy .kicker {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1E61F0;
      margin-bottom: 8px;
    }
    .copy h2 {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .copy p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #444;
    }
    .copy em { font-style: normal; font-weight: 600; color: #000; }

    /* ---- generic mock graphic ---- */
    .art {
      background: #f7f8fb;
      border: 1px solid #eceef3;
      border-radius: 10px;
      padding: 16px;
      height: 176px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
    }
    .mock-row { display: flex; align-items: center; gap: 8px; }
    .tab {
      font-size: 12px; color: #666; padding: 5px 9px; border-radius: 6px;
    }
    .tab.on { background: #e8eef8; color: #1E61F0; font-weight: 600; }
    .btn {
      font-size: 12px; font-weight: 600; color: #fff; background: #1E61F0;
      padding: 6px 12px; border-radius: 7px; display: inline-flex; align-items: center; gap: 5px;
    }
    .card-mini {
      border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 9px 11px;
      background: #fff; font-size: 12px; color: #444; flex: 1;
    }
    .card-mini.sel { border-color: #1E61F0; box-shadow: 0 1px 6px rgba(30,97,240,.12); }
    .card-mini .ct { font-weight: 600; color: #000; margin-bottom: 3px; font-size: 12px; }
    .field {
      background: #fff; border: 1.5px solid #e0e0e0; border-radius: 8px;
      padding: 9px 11px; font-size: 12px; color: #333; line-height: 1.45;
    }
    .flabel { font-size: 11px; color: #888; margin-bottom: 5px; }
    .setrow { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .setrow .k { color: #666; }
    .setrow .v { color: #000; font-weight: 600; }
    .chip {
      display: inline-block; background: #e8eef8; color: #1E61F0; font-size: 11px;
      font-weight: 600; padding: 3px 8px; border-radius: 20px;
    }
    .take { display: flex; gap: 8px; font-size: 11.5px; color: #444; line-height: 1.4; }
    .take .n {
      flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; background: #1E61F0;
      color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    }
    .take b { color: #000; font-weight: 600; }

    /* ---- nav ---- */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      margin: 18px 2px 0;
    }
    .nav button {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      border: 1.5px solid #e0e0e0; background: #fff; color: #1E61F0;
      transition: background .15s, border-color .15s, color .15s;
    }
    .nav button:hover:not(:disabled) { border-color: #1E61F0; }
    .nav button.primary { background: #1E61F0; color: #fff; border-color: #1E61F0; }
    .nav button:disabled { color: #bbb; border-color: #eee; cursor: default; }
    .counter { font-size: 12px; color: #888; }

    @media (max-width: 560px) {
      .panel { grid-template-columns: 1fr; }
      .art { order: -1; }
      .plabel { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="rail" id="rail"></div>

    <div class="panel">
      <div class="copy">
        <div class="kicker" id="kicker">Step 1 of 5</div>
        <h2 id="title"></h2>
        <p id="desc"></p>
      </div>
      <div class="art" id="art"></div>
    </div>

    <div class="nav">
      <button id="prev">← Back</button>
      <span class="counter" id="counter"></span>
      <button id="next" class="primary">Next →</button>
    </div>

  </div>

  <script>
    const steps = [
      {
        label: "Start a new agent",
        title: "Open AI Agents and start a new one",
        desc: "In the left navigation, open the <em>AI Agents</em> area and select <em>New agent</em>.",
        art: `
          <div class="mock-row"><span class="tab on">AI Agents</span><span class="tab">Dashboards</span><span class="tab">Charts</span></div>
          <div class="mock-row" style="margin-top:6px;justify-content:flex-end;"><span class="btn">+ New agent</span></div>`
      },
      {
        label: "Pick the template and dashboard",
        title: "Choose Dashboard Agent, then pick a dashboard",
        desc: "Select the <em>Dashboard Agent</em> template, then choose the dashboard you want it to watch.",
        art: `
          <div class="mock-row">
            <div class="card-mini sel"><div class="ct">Dashboard Agent</div>Watches one dashboard on a schedule</div>
            <div class="card-mini"><div class="ct">Chart Agent</div>Monitors a single chart</div>
          </div>
          <div class="field" style="margin-top:4px;">Dashboard: <b style="color:#000;">AmpliTunes Business Insights</b> ▾</div>`
      },
      {
        label: "Add a focus instruction",
        title: "Tell it what to prioritize",
        desc: "Add a focus instruction so the agent leads with what matters to you, not just what changed most.",
        art: `
          <div class="flabel">Focus instruction</div>
          <div class="field">Focus on where new users drop off before their first purchase, and flag any week-over-week change in the sign-up to purchase funnel.</div>`
      },
      {
        label: "Set how you hear from it",
        title: "Choose delivery and cadence",
        desc: "Set who gets the summary and how often: email recipients, a <em>Slack</em> or <em>Teams</em> channel, and the run schedule.",
        art: `
          <div class="setrow"><span class="k">Recipients</span><span class="chip">you@company.com</span></div>
          <div class="setrow"><span class="k">Channel</span><span class="v">Slack &middot; #growth</span></div>
          <div class="setrow"><span class="k">Frequency</span><span class="v">Weekly &middot; Thu &middot; 7:00 PM</span></div>`
      },
      {
        label: "Run and read the summary",
        title: "Run it and read the prioritized summary",
        desc: "Run the agent. It reads every chart on the dashboard and returns a ranked summary of what changed and what to look at first.",
        art: `
          <div class="take"><span class="n">1</span><span><b>First in-app action is the main leak</b> — only 33% of signups reach first search.</span></div>
          <div class="take"><span class="n">2</span><span><b>Sharing predicts purchase</b> — sharers convert at 21% vs 3%.</span></div>
          <div class="take"><span class="n">3</span><span><b>Conversion lands within a workday</b> — median ~9 hours after signup.</span></div>`
      }
    ];

    let cur = 0;
    const rail = document.getElementById("rail");
    const kicker = document.getElementById("kicker");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const art = document.getElementById("art");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const counter = document.getElementById("counter");

    // build rail
    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "pill";
      b.innerHTML = `<span class="dot">${i + 1}</span><span class="plabel">${s.label}</span>`;
      b.addEventListener("click", () => go(i));
      rail.appendChild(b);
    });
    const pills = Array.from(rail.children);

    function render() {
      const s = steps[cur];
      kicker.textContent = `Step ${cur + 1} of ${steps.length}`;
      title.textContent = s.title;
      desc.innerHTML = s.desc;
      art.innerHTML = s.art;
      counter.textContent = `${cur + 1} / ${steps.length}`;
      pills.forEach((p, i) => {
        p.classList.toggle("active", i === cur);
        p.classList.toggle("done", i < cur);
      });
      prev.disabled = cur === 0;
      next.textContent = cur === steps.length - 1 ? "Start over ↺" : "Next →";
    }

    function go(i) {
      cur = (i + steps.length) % steps.length;
      render();
    }

    prev.addEventListener("click", () => { if (cur > 0) go(cur - 1); });
    next.addEventListener("click", () => go(cur === steps.length - 1 ? 0 : cur + 1));

    render();
  </script>

</body>
</html>
